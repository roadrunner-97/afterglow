name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR — saves runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Qt6 + OpenCL + LibRaw from apt; pocl is a CPU OpenCL ICD so the GPU
      # tests can actually run on a headless runner.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache \
            qt6-base-dev qt6-base-dev-tools libqt6opengl6-dev \
            libgl1-mesa-dev \
            opencl-headers opencl-clhpp-headers ocl-icd-opencl-dev \
            pocl-opencl-icd \
            libraw-dev

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ci-${{ runner.os }}

      - name: Configure
        run: cmake -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -j8

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates wget gnupg
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache gcovr clang-format-22 \
            qt6-base-dev qt6-base-dev-tools libqt6opengl6-dev \
            libgl1-mesa-dev \
            opencl-headers opencl-clhpp-headers ocl-icd-opencl-dev \
            pocl-opencl-icd \
            libraw-dev

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: coverage-${{ runner.os }}

      - name: Check formatting
        env:
          CLANG_FORMAT: clang-format-22
        run: bash scripts/check-format.sh

      # This is deliberately server-side as well as in the pre-push hook:
      # local hooks can be skipped and do not protect pull requests.
      - name: Test with coverage
        env:
          QT_QPA_PLATFORM: offscreen
          COVERAGE_MIN_LINES: '100.0'
        run: bash scripts/check-coverage.sh
