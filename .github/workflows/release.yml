name: Release

# Triggered by pushing a tag like v1.0.0:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

# Required so action-gh-release can create the release.
permissions:
  contents: write

jobs:
  release:
    # Same as CI (ubuntu-24.04) to avoid 'unknown target CPU' issues on
    # newer runners like EPYC Genoa. Uses POCL 1.11 which supports these CPUs.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache \
            qt6-base-dev qt6-base-dev-tools libqt6opengl6-dev \
            libgl1-mesa-dev \
            opencl-headers opencl-clhpp-headers ocl-icd-opencl-dev \
            pocl-opencl-icd \
            libraw-dev

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: release-${{ runner.os }}

      - name: Configure
        run: cmake -B build -G Ninja

      - name: Build
        run: cmake --build build

      # Same test gate CI uses — block a release if anything is broken.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -j8

      - name: Package tarball
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="afterglow-${VERSION}-linux-x86_64"
          mkdir -p "$STAGE/bin"
          cp build/bin/afterglow "$STAGE/bin/"
          strip "$STAGE/bin/afterglow"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          ls -la "${STAGE}.tar.gz"*

      - name: Install AppImage tooling deps
        # FUSE is needed at runtime by the linuxdeploy / appimagetool AppImages
        # themselves. (The output AppImage runs fine without FUSE on the user's
        # box; it only matters here, on the build host.)
        run: sudo apt-get install -y --no-install-recommends fuse libfuse2 file

      - name: Build AppImage
        env:
          AFTERGLOW_VERSION: ${{ github.ref_name }}
        run: ./scripts/build-appimage.sh

      - name: Rename AppImage with version
        run: |
          set -euo pipefail
          cp Afterglow-x86_64.AppImage "afterglow-${{ github.ref_name }}-linux-x86_64.AppImage"
          sha256sum "afterglow-${{ github.ref_name }}-linux-x86_64.AppImage" > "afterglow-${{ github.ref_name }}-linux-x86_64.AppImage.sha256"
          ls -la afterglow-*.AppImage*

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            afterglow-*-linux-x86_64.tar.gz
            afterglow-*-linux-x86_64.tar.gz.sha256
            afterglow-*-linux-x86_64.AppImage
            afterglow-*-linux-x86_64.AppImage.sha256
          generate_release_notes: true
          body: |
            Linux x86_64 build of afterglow ${{ github.ref_name }}.

            Built on Ubuntu 24.04 (glibc 2.39) — runs on any Linux from
            ~2022 onward.

            ## AppImage (recommended)

            ```sh
            chmod +x afterglow-*-linux-x86_64.AppImage
            ./afterglow-*-linux-x86_64.AppImage
            ```

            Bundles Qt6, LibRaw, and a POCL CPU fallback. Uses the host's
            installed OpenCL vendor ICD (NVIDIA / AMD / Intel) for GPU
            acceleration; falls back to bundled POCL if none is installed.

            ## Tarball (system-Qt install)

            ```sh
            tar xzf afterglow-*-linux-x86_64.tar.gz
            cd afterglow-*-linux-x86_64
            ./bin/afterglow
            ```

            Requires Qt6, libGL, and an OpenCL ICD on the host. On Debian /
            Ubuntu:

            ```sh
            sudo apt-get install \
              libqt6core6 libqt6gui6 libqt6widgets6 \
              libqt6concurrent6 libqt6openglwidgets6 \
              ocl-icd-libopencl1 libgl1 libraw-bin
            ```
